<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transactions | The Creamy Cup</title>
    <style>
      :root {
        --brand: #e8892b;
        --ink: #262a3a;
        --muted: #6b6f80;
        --panel: #f4f2f5;
        --line: #d6d3dc;
        --danger: #c0392b;
        --success: #27ae60;
        --warning: #d35400;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--panel);
      }
      header {
        background: #fff;
        border-bottom: 1.5px solid var(--line);
        padding: 16px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-title img {
        height: 40px;
        width: auto;
        border-radius: 6px;
      }
      .brand-title h2 {
        margin: 0;
        font-size: 1.25rem;
      }
      .nav-links {
        display: flex;
        gap: 16px;
        margin-left: 32px;
      }
      .nav-links a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 0.95rem;
        padding: 6px 12px;
        border-radius: 6px;
      }
      .nav-links a.active {
        color: var(--brand);
        background: rgba(232, 137, 43, 0.1);
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 0.9rem;
      }
      .btn-logout {
        padding: 8px 14px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        color: var(--danger);
      }
      main {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        border-bottom: 2px solid var(--line);
      }
      .tab-btn {
        padding: 12px 24px;
        border: none;
        background: none;
        font: inherit;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
      }
      .tab-btn.active {
        color: var(--brand);
        border-bottom-color: var(--brand);
      }
      .content-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 24px;
      }
      .action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .btn-primary {
        background: var(--brand);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th,
      td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem;
      }
      th {
        background: #faf9fb;
        color: var(--muted);
      }
      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.78rem;
        font-weight: 700;
      }
      .badge.success {
        background: #e8f6ee;
        color: var(--success);
      }
      .badge.warning {
        background: #fef5e7;
        color: var(--warning);
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(38, 42, 58, 0.5);
        place-items: center;
        padding: 16px;
        z-index: 100;
      }
      .modal-backdrop.show {
        display: grid;
      }
      .modal {
        background: #fff;
        border-radius: 12px;
        width: min(520px, 100%);
        padding: 24px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 4px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center">
        <div class="brand-title">
          <img
            src="images/logo.jpg"
            alt="Logo"
            onerror="this.style.display = 'none'"
          />
          <h2>The Creamy Cup</h2>
        </div>
        <nav class="nav-links">
          <a href="masterdata.html">Master Data</a>
          <a href="transactions.html" class="active">Transactions</a>
          <a href="reports.html">Reports</a>
          <a href="inventory.html">Inventory & Stock</a>
          <a href="audit.html">Equipment Audit</a>
        </nav>
      </div>
      <div class="user-info">
        <span id="userNameDisplay">Welcome, User</span>
        <button class="btn-logout" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main>
      <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'sales')">
          Sales Log
        </button>
        <button class="tab-btn" onclick="switchTab(event, 'rentals')">
          Rental Logs
        </button>
        <button class="tab-btn" onclick="switchTab(event, 'purchases')">
          Purchase History
        </button>
        <button class="tab-btn" onclick="switchTab(event, 'stock-movements')">
          Stock Movements
        </button>
      </nav>

      <section class="content-card">
        <div class="action-bar">
          <h3 id="sectionTitle">Sales Log</h3>
          <button class="btn-primary" id="addBtn" onclick="openCreateModal()">
            + Create New Sale
          </button>
        </div>
        <div style="overflow-x: auto">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3>Record New Sale</h3>
        <form id="saleForm">
          <div class="form-group">
            <label>Customer ID *</label>
            <input type="number" id="customer_id" required />
          </div>
          <div class="form-group">
            <label>Amount (₱) *</label>
            <input type="number" step="0.01" id="amount" required />
          </div>
          <div class="form-group">
            <label>Payment Method *</label>
            <select id="payment_method">
              <option value="Cash">Cash</option>
              <option value="GCash">GCash</option>
              <option value="Credit Card">Credit Card</option>
            </select>
          </div>
          <div
            style="
              display: flex;
              justify-content: flex-end;
              gap: 10px;
              margin-top: 20px;
            "
          >
            <button type="button" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-primary">Submit Sale</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:3000/api/transactions";
      let currentTab = "sales";
      let currentUser = null;

      document.addEventListener("DOMContentLoaded", () => {
        const userData =
          localStorage.getItem("user") || sessionStorage.getItem("user");
        if (!userData) {
          window.location.href = "login.html";
          return;
        }
        currentUser = JSON.parse(userData);
        document.getElementById("userNameDisplay").textContent =
          `Logged in: ${currentUser.first_name || currentUser.username}`;
        loadTabData();
      });

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("user");
        sessionStorage.removeItem("user");
        window.location.href = "login.html";
      });

      function switchTab(evt, tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        evt.target.classList.add("active");

        const titles = {
          sales: "Sales Log",
          rentals: "Rental Logs",
          purchases: "Purchase History",
          "stock-movements": "Stock Movements Log",
        };
        document.getElementById("sectionTitle").textContent =
          titles[tab] || "Transactions Log";
        document.getElementById("addBtn").style.display =
          tab === "sales" ? "block" : "none";
        loadTabData();
      }

      async function loadTabData() {
        const tbody = document.getElementById("tableBody");
        const thead = document.getElementById("tableHead");
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Loading data...</td></tr>`;

        let endpoint = `${API_BASE}/${currentTab}`;
        if (currentTab === "rentals") {
          endpoint = `${API_BASE}/rental-logs`;
        } else if (currentTab === "purchases") {
          endpoint = `${API_BASE}/purchase-history`;
        }

        try {
          const res = await fetch(endpoint);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to load data");
          renderTable(data);
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="6" style="color:var(--danger); text-align:center;">${err.message}</td></tr>`;
        }
      }

      function renderTable(data) {
        const tbody = document.getElementById("tableBody");
        const thead = document.getElementById("tableHead");
        tbody.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>`;
          return;
        }

        if (currentTab === "sales") {
          thead.innerHTML = `<tr><th>Sale ID</th><th>Customer ID</th><th>User ID</th><th>Total Amount</th><th>Status</th><th>Sale Date</th></tr>`;
          data.forEach((item) => {
            tbody.innerHTML += `
              <tr>
                <td>#${item.sale_id || item.id}</td>
                <td>Customer #${item.customer_id}</td>
                <td>User #${item.user_id}</td>
                <td>₱${parseFloat(item.total_amount || item.amount || 0).toFixed(2)}</td>
                <td>${item.status || "Completed"}</td>
                <td>${item.sale_date ? new Date(item.sale_date).toLocaleString() : "-"}</td>
              </tr>`;
          });
        } else if (currentTab === "rentals") {
          thead.innerHTML = `<tr><th>Rental ID</th><th>Customer</th><th>Equipment</th><th>Start Time</th><th>End Time</th><th>Status</th></tr>`;
          data.forEach((item) => {
            tbody.innerHTML += `
              <tr>
                <td>#${item.rental_id || item.rental_log_id || item.id}</td>
                <td>${item.customer_name || `Customer #${item.customer_id}`}</td>
                <td>${item.equipment_name || `Equipment #${item.equipment_id}`}</td>
                <td>${item.start_time ? new Date(item.start_time).toLocaleString() : "-"}</td>
                <td>${item.end_time ? new Date(item.end_time).toLocaleString() : "Ongoing"}</td>
                <td>${item.status || "Active"}</td>
              </tr>`;
          });
        } else if (currentTab === "purchases") {
          thead.innerHTML = `<tr><th>Purchase ID</th><th>Supplier</th><th>User ID</th><th>Total Cost</th><th>Purchase Date</th></tr>`;
          data.forEach((item) => {
            tbody.innerHTML += `
              <tr>
                <td>#${item.purchase_id || item.id}</td>
                <td>${item.supplier_name || `Supplier #${item.supplier_id}`}</td>
                <td>User #${item.user_id}</td>
                <td>₱${parseFloat(item.total_cost || item.total_amount || 0).toFixed(2)}</td>
                <td>${item.purchase_date ? new Date(item.purchase_date).toLocaleString() : "-"}</td>
              </tr>`;
          });
        } else if (currentTab === "stock-movements") {
          thead.innerHTML = `<tr><th>Movement ID</th><th>Item Name</th><th>Type</th><th>Quantity</th><th>Movement Date</th></tr>`;
          data.forEach((item) => {
            const isIN = item.movement_type === "IN";
            tbody.innerHTML += `
              <tr>
                <td>#${item.movement_id || item.id}</td>
                <td>${item.item_name || `Inventory #${item.inventory_id}`}</td>
                <td><span class="badge ${isIN ? "success" : "warning"}">${item.movement_type}</span></td>
                <td>${item.quantity}</td>
                <td>${item.movement_date ? new Date(item.movement_date).toLocaleString() : "-"}</td>
              </tr>`;
          });
        }
      }

      function openCreateModal() {
        document.getElementById("modalBackdrop").classList.add("show");
      }
      function closeModal() {
        document.getElementById("modalBackdrop").classList.remove("show");
      }

      document
        .getElementById("saleForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const now = new Date();
          const formattedDate = now
            .toISOString()
            .slice(0, 19)
            .replace("T", " ");

          const payload = {
            customer_id: document.getElementById("customer_id").value,
            user_id: currentUser.user_id || 1,
            sale_date: formattedDate,
            total_amount: document.getElementById("amount").value,
            payment_method: document.getElementById("payment_method").value,
            status: "Completed",
          };

          try {
            const res = await fetch(`${API_BASE}/sales`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const result = await res.json();
            if (res.ok) {
              closeModal();
              loadTabData();
            } else {
              alert(result.error || result.message || "Failed to add sale");
            }
          } catch (err) {
            alert(err.message);
          }
        });
    </script>
  </body>
</html>
